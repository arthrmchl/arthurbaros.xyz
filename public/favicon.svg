<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .paper { fill: #eef1ec; } .film { fill: #1d5c78; } .livre { fill: #66661c; } .serie { fill: #8a3d36; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #12191e; } .film { fill: #7cc0dd; } .livre { fill: #c6c66a; } .serie { fill: #e39a8f; }
    }
  </style>
  <rect class="paper" width="32" height="32" rx="7"/>
  <!-- Mêmes formes que le logo du header (viewBox 4 9 27 14), réduites pour tenir avec une marge. -->
  <g transform="translate(16 16) scale(0.9) translate(-17.5 -16)">
    <circle class="film" cx="11" cy="16" r="7"/>
    <rect class="livre" x="19" y="9" width="7" height="14" rx="1"/>
    <rect class="serie" x="27" y="9" width="4" height="4" rx="0.75"/>
    <rect class="serie" x="27" y="14" width="4" height="4" rx="0.75"/>
    <rect class="serie" x="27" y="19" width="4" height="4" rx="0.75"/>
  </g>
</svg>
